<html>

        <meta charset="UTF-8">

 <body> 
 <div style="color:red;font-size:50px;"> 
    <script language="JavaScript"> 
  var x_pac=prompt("podaj liczbę x=",""); 
               var a_pac=parseFloat(x_pac); 
    document.write("czytana liczba x="+a_pac+"<br>");     
                if(a_pac>0) 
                      {document.write("czytana liczba jest większa od 0"+"<br>");} 

                if(a_pac==0) 
                      {document.write("czytana liczba jest równo 0"+"<br>");}

                if(a_pac<0) 
                      {document.write("czytana liczba jest mniejsza od 0"+"<br>");}
// Dokończ dwa pozostałe przypadki a==0   i  a<0 
// polskie litery mają działać(uzupełnij w kodzie strony) 
                  </script> 
 </div> 
 </body> 
</html>
