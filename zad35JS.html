<!DOCTYPE html>  
<html lang="pl-PL">  
<meta charset="UTF-8">                    <!-- polskie litery mają działać(uzupełnij w kodzie strony meta) --> 
 <title> Z35 Paciorek </title>                             <!-- title -> Z35 oraz nazwisko ucznia --> 
     <body> 
 <div style="color:red;font-size:50px;"> 
    <script language="JavaScript"> 
  var x=prompt("podaj liczbę x=",""); 
               var a_dana_pac=parseFloat(x); 
//zmien zmienną „a” na a_dana_kow 
    document.write("czytana liczba x="+a_dana_pac+"<br>");     
                if(a_dana_pac>0) 
                      {document.write("czytana liczba jest większa od 0"+"<br>");} 
// Dokończ dwa pozostałe przypadki a==0   i  a<0 
                if(a_dana_pac<0) 
                      {document.write("czytana liczba jest mniejsza od 0"+"<br>");}
                if(a_dana_pac==0) 
                      {document.write("czytana liczba jest równa od 0"+"<br>");}
                  </script> 
 </div> 
 </body> 
</html> 
<!--  Paciorek Z35_JS  -->
