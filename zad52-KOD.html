<!DOCTYPE html> 
<html lang="pl"> 
<head>  
   <meta charset="utf-8"> 
    <title>  Przykład użycia pętli </title> 
  <script language="JavaScript"> 
  document.write("<font color=red size=2cm>Krzysztof Paciorek</font> <br> <font color=blue size=5mm> Wyprowadzanie liczb od 1 do 10 przesuniętych o jedną spację w prawo. Demonstarcja pętli zagnieżdżonych ( czyli pętla w pętli). </font><br>")
   for ( var i_pac=1; i_pac<=10; i_pac++) 
    { 
       for ( var k_pac=1; k_pac<=i_pac; k_pac++) 
        { 
           document.write("&nbsp");     
         } 
         document.write(i_pac+"<br>"); 
     } 
     
  </script>
