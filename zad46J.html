<!DOCTYPE html>
<html> 
    <body> 
        <div style="color:forestgreen;font-size:42px;"> 
            <script language="JavaScript"> 
            document.write("Wielkość liter to 42px a ilość wykonania pętli to 10"+"<br>");
                for(i_pac=0;i_pac<=10;i_pac++) 
                { 
                    if(i_pac%2==0)
                    document.write(+i_pac+" Krzysztof"+"<br>"); 
                    else
                    document.write(+i_pac+" Paciorek"+"<br>")
                } 
            </script> 
        </div> 
    </body> 
</html>
